# 简体中文版（zh 分支）相对 upstream 的配置差异，集中记在这里：
#   1. 新增 lang: zh —— 界面文案（搜索、侧栏折叠、深色模式、定理/引理等标题）走 Quarto 自带的中文语言包。
#   2. crossref 前缀改为中文/符号，避免 "Figure 1"、"Section 3.2" 这类英文前缀。
#   3. 删掉 language.crossref-ch-prefix: Chapter —— 本书没有 @ch- 形式的章节引用，留着只会输出英文。
#   4. 删掉 google-analytics 与 downloads: [pdf] —— 前者在国内不可达，后者会指向一个不存在的 PDF。
#   5. 习题不在本书的 chapters 列表里：book 类型的 project.render 不会额外渲染未列出的文件（实测只渲染 11 页），
#      所以照上游处理讲义的办法，给 src/psets/ 单独建一个嵌套项目，渲染到 _book/src/psets/。见 src/psets/_quarto.yml。
#      （pset4.qmd 在 upstream 里是 0 字节的空文件，未纳入。）
#   6. repo-url 指向本 fork。

# Required Quarto extensions (install with `quarto add <name>`):
#   - coatless-quarto/pyodide
#   - pandoc-ext/section-bibliographies
#   - leovan/quarto-pseudocode
# （上游注释里的 coatless/pyodide 与 pandoc-ext/boxes 已失效：前者改名到 coatless-quarto，
#    后者在正文里没有任何 .box 用法，8 处分块用的都是 Quarto 内置的 callout。）

project:
  type: book
  output-dir: _book
  preview:
    port: 4200

lang: zh

resources:
  - "*.pdf"
  
reference-location: document # footnotes in margin
citation-location: document # citations in margin
link-citations: true       # citations link to references

bibliography: src/references.bib
reference-section-title: 参考文献

crossref:
  fig-prefix: 图
  tbl-prefix: 表
  eq-prefix: 式
  sec-prefix: "§"

df-print: kable
filters:
  - pseudocode

format:
  html:
    theme:
      light: [flatly, resources/scss/global.scss]
      dark: [darkly, resources/scss/global.scss]
    published-title: "更新于"
    code-fold: false
    code-overflow: scroll
    code-line-numbers: true
    code-tools: true
    code-copy: True
    mathjax: 
      macros:
        mathbbm: ["\\mathbbm{#1}", 1]
    include-in-header:
      text: |
        <script>
        MathJax = {
          loader: {
            load: ['[tex]/boldsymbol']
          },
          tex: {
            tags: "none",
            inlineMath: [['$','$'], ['\\(','\\)']],
            displayMath: [['$$','$$'], ['\\[','\\]']],
            processEscapes: true,
            processEnvironments: true,
            packages: {
              '[+]': ['boldsymbol']
            }
          }
        };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" type="text/javascript"></script>


  pdf:
    documentclass: scrreprt
    classoption: [numbers=noenddot,DIV=11]
    keep-tex: true
    include-in-header: resources/tex/preamble.tex
    include-after-body: resources/tex/postamble.tex
    template-partials:
      - resources/tex/partials/before-body.tex
    citeproc: false # don't run pandoc default citation handling
    filters:
      - resources/tex/protect-crossrefs.lua
      - section-bibliographies
    toc-depth: 2 # level 1 headings (i.e. parts and chapters)
    toc-title: Table of Contents # title of table of contents
    links-as-notes: true # turn URLs into sidenotes
    citecolor: DarkGreen # tufte color
    linkcolor: DarkBlue # tufte color
    urlcolor: DarkGreen # tufte color
    code-overflow: wrap
    code-line-numbers: true
    include-before-body:
      text: |
        \RecustomVerbatimEnvironment{verbatim}{Verbatim}{
          showspaces = false,
          showtabs = false,
          breaksymbolleft={},
          breaklines
        }


knitr:
  opts_chunk:
    comment: "#>"
    collapse: TRUE
    cache.lazy: FALSE
    dev: "png"
    dpi: 300

execute:
  freeze: auto
  eval: false
  echo: true
  message: false
  warning: false
  error: false
  cache: false
  highlight-style: github
  tidy: true

book:
  title: "人类偏好机器学习"
  subtitle: "Machine Learning from Human Preferences（简体中文译本）"
  author:
    - name: Sang T. Truong
      orcid: 0000-0001-8069-9410
    - name: Andreas Haupt
      orcid: 0000-0002-2952-4188
    - name: Sanmi Koyejo
      orcid: 0000-0002-4023-419X
    
  date: last-modified
  repo-url: https://github.com/CodingPracticeGroup/mlhp
  repo-actions: [source, issue]
  sidebar:
    style: "docked"
    footer: license.qmd
  chapters:
    - index.qmd
    - src/chap1.qmd
    - src/chap2.qmd
    - src/chap3.qmd
    - src/chap4.qmd
    - src/chap5.qmd
    - src/chap6.qmd
    - src/chap7.qmd
    - src/teaching.qmd
  appendices:
    - src/notation.qmd
    - src/glossary.qmd
